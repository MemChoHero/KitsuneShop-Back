services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kitsune-shop-api

    restart: unless-stopped

    ports:
      - "${API_PORT}:3000"

    volumes:
      - .:/api
      - /api/node_modules

    env_file:
      - .env

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine

    container_name: kitsune-shop-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: kitsune-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: